name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      # Signaling + negotiation + (when a cached chromium exists) UI layout.
      # Without this step a stale check script ships broken to `npm run release`.
      - run: npm run self-check
