# Maintains CHANGELOG.md, version bumps and GitHub Releases.
#
# Flow: commit with Conventional Commits (feat:/fix:/…) → this workflow opens
# or updates a Release PR → merging it creates the version tag + GitHub Release.
# The publish workflow then takes over (npm publish).

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json